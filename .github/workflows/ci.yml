name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [created, published]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check, Lint & Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint with Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features

  build:
    name: Build (${{ matrix.target }})
    needs: check
    runs-on: macos-latest
    strategy:
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentmode-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/agentmode

  release:
    name: Release binaries
    needs: build
    runs-on: macos-latest
    if: github.event_name == 'release'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: agentmode-aarch64-apple-darwin
          path: dist/arm64

      - name: Download x86_64 binary
        uses: actions/download-artifact@v4
        with:
          name: agentmode-x86_64-apple-darwin
          path: dist/x86_64

      - name: Create universal binary
        run: |
          lipo -create \
            dist/arm64/agentmode \
            dist/x86_64/agentmode \
            -output dist/agentmode-universal
          chmod +x dist/agentmode-universal

      - name: Package
        run: |
          cd dist
          tar czf agentmode-macos-universal.tar.gz agentmode-universal
          tar czf agentmode-macos-arm64.tar.gz -C arm64 agentmode
          tar czf agentmode-macos-x86_64.tar.gz -C x86_64 agentmode

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/agentmode-macos-universal.tar.gz
            dist/agentmode-macos-arm64.tar.gz
            dist/agentmode-macos-x86_64.tar.gz
